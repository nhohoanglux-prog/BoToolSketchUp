<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bộ Tool SketchUp</title>
<script src="icons.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 12px "Segoe UI", Arial, sans-serif; background: #f3f3f3; color: #222; display: flex; flex-direction: column; }
  .top { padding: 8px 8px 6px; background: #fff; border-bottom: 1px solid #ddd; }
  #q { width: 100%; padding: 5px 8px; border: 1px solid #bbb; border-radius: 5px; font: inherit; }
  #q:focus { outline: none; border-color: #2b6cd4; }
  #list { flex: 1; overflow-y: auto; padding: 4px 6px 8px; }
  .grp { margin: 8px 2px 3px; font-weight: 600; color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; cursor: pointer; user-select: none; }
  .grp .n { color: #999; font-weight: 400; }
  .tool { display: flex; gap: 8px; align-items: flex-start; padding: 6px 7px; margin: 2px 0; background: #fff; border: 1px solid #e2e2e2; border-radius: 6px; cursor: pointer; }
  .tool:hover { border-color: #6b9be0; background: #f2f7ff; }
  .tool .ic { color: #2b6cd4; flex: none; padding-top: 1px; }
  .tool .nm { font-weight: 600; }
  .tool .ds { color: #555; margin-top: 1px; }
  .tool .vr { color: #999; font-size: 10.5px; margin-top: 2px; }
  .new { background: #e5484d; color: #fff; font-size: 9.5px; font-weight: 700; border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
  .empty { color: #888; text-align: center; padding: 20px 6px; }
  #upd { display: none; margin: 6px 6px 0; background: #fff4d6; border: 1px solid #e3b341; border-radius: 6px; padding: 6px 8px; }
  #upd ul { margin: 3px 0 6px; padding-left: 16px; }
  #upd li { margin: 2px 0; color: #444; }
  .bottom { padding: 6px 8px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; gap: 6px; }
  .bottom .v { color: #888; flex: 1; }
  button { font: inherit; padding: 3px 9px; border: 1px solid #aaa; border-radius: 4px; background: #fafafa; cursor: pointer; }
  button:hover { background: #e9f1ff; border-color: #6b9be0; }
  button.main { background: #2b6cd4; color: #fff; border-color: #2b6cd4; font-weight: 600; }
  button.green { background: #1e8e3e; color: #fff; border-color: #1e8e3e; }
  #msg { padding: 0 8px 6px; background: #fff; font-size: 11px; min-height: 0; }
  #msg.err { color: #c0392b; }
  #msg.ok { color: #1e7d32; }
</style>
</head>
<body>
<div class="top"><input id="q" type="text" placeholder="Tìm tool (gõ không dấu cũng được)…" autocomplete="off"></div>
<div id="upd">
  <b>🔔 Có bản mới</b>
  <ul id="updList"></ul>
  <button class="main" onclick="sketchup.doupdate('')">⬇ Cập nhật ngay</button>
</div>
<div id="list"><div class="empty">Đang đọc danh sách tool…</div></div>
<div id="msg"></div>
<div class="bottom">
  <span class="v" id="ver">Bộ Tool SketchUp</span>
  <button id="btnUpd" onclick="sketchup.check('')" title="Kiểm tra bản mới trên GitHub">⬇ Cập nhật</button>
</div>

<script>
var DATA = { tools: [] };
var collapsed = {};
try { collapsed = JSON.parse(localStorage.getItem('bt.collapsed') || '{}'); } catch (e) { collapsed = {}; }

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function plain(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }

function setList(d) {
  DATA = d;
  $('ver').textContent = 'Bộ Tool SketchUp v' + d.version + ' · ' + d.date;
  render();
}

function render() {
  var q = plain($('q').value).trim();
  var words = q ? q.split(/\s+/) : [];
  var groups = {}, order = [];
  DATA.tools.forEach(function (t) {
    var hay = plain(t.name + ' ' + t.group + ' ' + t.desc + ' ' + t.id);
    for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) < 0) return;
    if (!groups[t.group]) { groups[t.group] = []; order.push(t.group); }
    groups[t.group].push(t);
  });
  order.sort(function (a, b) { return a.localeCompare(b, 'vi'); });
  var h = '';
  order.forEach(function (g) {
    var closed = collapsed[g] && !q;
    h += '<div class="grp" data-g="' + esc(g) + '">' + (closed ? '▸ ' : '▾ ') + esc(g) + ' <span class="n">(' + groups[g].length + ')</span></div>';
    if (closed) return;
    groups[g].sort(function (a, b) { return a.name.localeCompare(b.name, 'vi'); }).forEach(function (t) {
      h += '<div class="tool" data-id="' + esc(t.id) + '" title="Bấm để chạy">' +
        '<span class="ic">' + window.TL_iconSvg({ icon: t.icon, name: t.name, file: t.id }, 20) + '</span>' +
        '<div><div class="nm">' + esc(t.name) + (t.isNew ? '<span class="new">MỚI</span>' : '') + '</div>' +
        '<div class="ds">' + esc(t.desc) + '</div>' +
        '<div class="vr">v' + esc(t.version) + (t.date ? ' · ' + esc(t.date) : '') + '</div></div></div>';
    });
  });
  if (!h) h = '<div class="empty">' + (DATA.tools.length ? 'Không có tool nào khớp "' + esc($('q').value) + '".' : 'Chưa có tool nào.') + '</div>';
  $('list').innerHTML = h;
}

function showUpdate(items) {
  if (!items || !items.length) { $('upd').style.display = 'none'; $('btnUpd').className = ''; $('btnUpd').textContent = '⬇ Cập nhật'; return; }
  var h = '';
  items.forEach(function (i) {
    h += '<li><b>' + esc(i.name) + ' v' + esc(i.version) + '</b>' + (i.isNew ? ' (tool mới)' : '') + (i.notes ? ': ' + esc(i.notes) : '') + '</li>';
  });
  $('updList').innerHTML = h;
  $('upd').style.display = 'block';
  $('btnUpd').className = 'green';
  $('btnUpd').textContent = '⬇ Cập nhật (' + items.length + ')';
}

function setChecking(on) { $('btnUpd').disabled = !!on; if (on) $('btnUpd').textContent = 'Đang kiểm tra…'; else if ($('btnUpd').className != 'green') $('btnUpd').textContent = '⬇ Cập nhật'; }

function showMsg(t, isErr) { var m = $('msg'); m.textContent = t || ''; m.className = isErr ? 'err' : 'ok'; }

$('q').addEventListener('input', render);
$('q').addEventListener('keydown', function (e) {
  if (e.key == 'Enter') { var first = document.querySelector('.tool'); if (first) sketchup.run(first.getAttribute('data-id')); }
  if (e.key == 'Escape') { $('q').value = ''; render(); }
});
$('list').addEventListener('click', function (e) {
  var el = e.target;
  while (el && el != this) {
    if (el.className == 'tool') { sketchup.run(el.getAttribute('data-id')); return; }
    if (el.className == 'grp') {
      var g = el.getAttribute('data-g'); collapsed[g] = !collapsed[g];
      try { localStorage.setItem('bt.collapsed', JSON.stringify(collapsed)); } catch (er) { }
      render(); return;
    }
    el = el.parentNode;
  }
});
window.onload = function () { $('q').focus(); sketchup.ready(''); };
</script>
</body>
</html>
